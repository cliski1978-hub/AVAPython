# Keep native validation manually dispatchable after initial repository setup.
name: AVA Phase 6.11 filesystem security

on:
  pull_request:
    paths:
      - ".github/workflows/ava-phase-6-11-filesystem-security.yml"
      - "backend/pyproject.toml"
      - "backend/src/ava/infrastructure/workspace_filesystem/**"
      - "backend/src/ava/infrastructure/persistence/migrations/versions/**"
      - "backend/src/ava/infrastructure/persistence/repositories/invocation_reservation_repository.py"
      - "backend/src/ava/repositories/invocation_reservation_repository.py"
      - "backend/src/ava/contracts/security_identity.py"
      - "backend/src/ava/contracts/workspace_grants.py"
      - "backend/src/ava/repositories/workspace_grant_repository.py"
      - "backend/src/ava/services/run_access_service.py"
      - "backend/src/ava/services/run_execution_authority_service.py"
      - "backend/src/ava/services/workspace_grant_*.py"
      - "backend/src/ava/infrastructure/persistence/repositories/workspace_grant_repository.py"
      - "backend/src/ava/tools/**"
      - "backend/src/ava/services/tool_*.py"
      - "backend/src/ava/api/app.py"
      - "backend/src/ava/api/routes/capabilities.py"
      - "backend/src/ava/api/routes/health.py"
      - "backend/src/ava/infrastructure/composition.py"
      - "backend/src/ava/workspaces/**"
      - "backend/tests/test_workspace*"
      - "backend/tests/test_tool_*.py"
      - "backend/tests/test_approvals.py"
      - "backend/tests/test_invocation_reservations.py"
      - "backend/tests/test_phase_6_14a_trusted_authority.py"
      - "backend/tests/test_capabilities.py"
      - "backend/tests/test_health.py"
      - "backend/conftest.py"
      - "backend/tests/test_persistence_migrations.py"
      - "backend/tests/test_run*.py"
      - "backend/tests/test_relational_run_event_repository.py"
      - "backend/tests/test_architecture.py"
  push:
    paths:
      - ".github/workflows/ava-phase-6-11-filesystem-security.yml"
      - "backend/pyproject.toml"
      - "backend/src/ava/infrastructure/workspace_filesystem/**"
      - "backend/src/ava/infrastructure/persistence/migrations/versions/**"
      - "backend/src/ava/infrastructure/persistence/repositories/invocation_reservation_repository.py"
      - "backend/src/ava/repositories/invocation_reservation_repository.py"
      - "backend/src/ava/contracts/security_identity.py"
      - "backend/src/ava/contracts/workspace_grants.py"
      - "backend/src/ava/repositories/workspace_grant_repository.py"
      - "backend/src/ava/services/run_access_service.py"
      - "backend/src/ava/services/run_execution_authority_service.py"
      - "backend/src/ava/services/workspace_grant_*.py"
      - "backend/src/ava/infrastructure/persistence/repositories/workspace_grant_repository.py"
      - "backend/src/ava/tools/**"
      - "backend/src/ava/services/tool_*.py"
      - "backend/src/ava/api/app.py"
      - "backend/src/ava/api/routes/capabilities.py"
      - "backend/src/ava/api/routes/health.py"
      - "backend/src/ava/infrastructure/composition.py"
      - "backend/src/ava/workspaces/**"
      - "backend/tests/test_workspace*"
      - "backend/tests/test_tool_*.py"
      - "backend/tests/test_approvals.py"
      - "backend/tests/test_invocation_reservations.py"
      - "backend/tests/test_phase_6_14a_trusted_authority.py"
      - "backend/tests/test_capabilities.py"
      - "backend/tests/test_health.py"
      - "backend/conftest.py"
      - "backend/tests/test_persistence_migrations.py"
      - "backend/tests/test_run*.py"
      - "backend/tests/test_relational_run_event_repository.py"
      - "backend/tests/test_architecture.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-security:
    name: Filesystem security (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev,openhands-tools]"

      - name: Verify Windows filesystem fixture capabilities
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "ava-phase-6-11-capability"
          $target = Join-Path $root "target"
          $junction = Join-Path $root "junction"
          $symbolic = Join-Path $root "symbolic"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          try {
            New-Item -ItemType Junction -Path $junction -Target $target -ErrorAction Stop | Out-Null
            New-Item -ItemType SymbolicLink -Path $symbolic -Target $target -ErrorAction Stop | Out-Null
          } catch {
            Write-Error "Mandatory NTFS junction/symlink test capability is unavailable: $_"
            exit 1
          } finally {
            Remove-Item -LiteralPath $symbolic -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $junction -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }
          $volume = Get-Volume -DriveLetter $env:SystemDrive.Substring(0,1)
          if ($volume.FileSystem -ne "NTFS") {
            Write-Error "Mandatory NTFS validation requires NTFS; runner reported $($volume.FileSystem)"
            exit 1
          }

      - name: Run shared filesystem and authorization contracts
        run: >-
          python -m pytest -q
          tests/test_workspace_filesystem_contract.py
          tests/test_tool_execution_service.py
          tests/test_tool_policy.py
          tests/test_workspace_access.py
          tests/test_tool_registry.py
          tests/test_tool_features.py
          tests/test_approvals.py
          tests/test_invocation_reservations.py
          tests/test_phase_6_14a_trusted_authority.py
          tests/test_capabilities.py
          tests/test_health.py
          tests/test_persistence_migrations.py
          tests/test_run_lifecycle.py
          tests/test_run_lifecycle_integration.py
          tests/test_run_attempts.py
          tests/test_run_recovery.py
          tests/test_run_events.py
          tests/test_run_event_concurrency.py
          tests/test_run_inspection.py
          tests/test_relational_run_event_repository.py
          tests/test_architecture.py

      - name: Run Linux filesystem adversarial tests
        if: runner.os == 'Linux'
        run: python -m pytest -q tests/test_workspace_read_tools.py

      - name: Run Windows native filesystem security tests
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_windows_workspace_filesystem.py

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run strict mypy on Linux
        if: runner.os == 'Linux'
        run: python -m mypy src/ava
