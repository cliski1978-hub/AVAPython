name: Desktop E2E

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Tauri desktop acceptance (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install Tauri and headless display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            x11-utils \
            xvfb

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests and type checks
        run: |
          pnpm test
          pnpm lint

      - name: Install backend dependencies
        run: uv sync --project backend --frozen

      - name: Run native desktop acceptance tests
        run: xvfb-run --auto-servernum pnpm test:e2e:desktop
