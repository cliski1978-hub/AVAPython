[project]
name = "ava-client"
version = "0.1.0"
description = "AVA Python Client — Lightweight API client for AVA backend"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ava_client"]
